<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cadastre-se | Ateliê Santa Terezinha</title>
    <link rel="icon" href="img/logo.jpeg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header><a class="brand" href="index.html"><img src="img/logo.jpeg" alt="Ateliê Santa Terezinha"
                style="width:72px;height:72px;border-radius:50%;object-fit:cover;display:block"></a>
        <nav aria-label="Navegação principal"><a href="index.html">Início</a><a href="produtos.html">Produtos</a></nav><form class="search" action="produtos.html" role="search"><input id="search" name="q" type="search"
                placeholder="Buscar imagens sacras..." aria-label="Buscar produtos"><button type="submit" aria-label="Buscar produtos">⌕</button></form>
        <div class="account"><nav class="auth-tabs" aria-label="Acesso à conta"><a href="cadastro.html" aria-current="page">Cadastre-se</a><span>|</span><a href="entrar.html" >Entre</a></nav><button class="cart-button" id="cartBtn"
                aria-label="Abrir carrinho">🛒 <sup id="cartCount">0</sup></button></div>
    </header>
    <main><section class="auth-page"><h1>Crie sua conta</h1><form id="registerForm" class="profile-form"><label>Nome completo<input name="name" type="text" required autocomplete="name" maxlength="100" placeholder="Ex.: Fulano da Silva"></label><label>E-mail<input name="email" type="email" required autocomplete="email" maxlength="254" placeholder="Ex.: fulano@email.com"></label><label>Telefone (opcional)<input name="phone" type="tel" autocomplete="tel" maxlength="25" placeholder="Ex.: (51) 99999-9999"></label><label>Senha<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="Crie uma senha com pelo menos 8 caracteres"></label><label>Confirme sua senha<input name="confirm" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="Digite a mesma senha novamente"></label><p class="local-note">Versão local: seus dados ficam somente neste navegador. Use uma senha exclusiva de demonstração.</p><p class="form-message" role="status"></p><button class="primary">Cadastrar-se</button></form></section></main>
    <footer>
        <div><b>Entre em contato</b><a href="https://wa.me/5551996643587" target="_blank" rel="noopener">☏ +55 51
                99664-3587</a></div>
        <div><b>Redes sociais</b><a href="https://www.instagram.com/terezinhaateliesanta/" target="_blank"
                rel="noopener">◎ @terezinhaateliesanta</a></div><small>© <span id="year"></span> Ateliê Santa
            Terezinha</small>
    </footer>
    <dialog id="productDialog"><button class="close" data-close aria-label="Fechar">×</button>
        <div id="productDetail"></div>
    </dialog>
<script src="script.js"></script>
    <script src="conta.js"></script>
</body>

</html>
